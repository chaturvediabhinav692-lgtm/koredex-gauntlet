name: CI

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup environment
        run: bash scripts/setup_env.sh

      - name: Install dependencies
        run: bash scripts/install_deps.sh

      - name: Run tests
        run: pytest -v
